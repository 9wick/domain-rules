name: Release PR

on:
  push:
    branches: [main]

permissions:
  contents: write # the release notes API requires it
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: 9wick/release-flow/release-pr@068cdf82d8673008a7eb2e89b72709cfa14a41de # v1
        with:
          production-branch: release
          staging-branch: main
